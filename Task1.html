<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a train ticket</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9 col-xl-8">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <!-- Шапка формы -->
                    <div class="card-header text-white p-4 p-md-5 pb-4" style="background-color: #0F6B5F;">
                        <h2 class="fw-bold mb-0">Book a train ticket</h2>
                    </div>
                    
                    <!-- Тело формы -->
                    <div class="card-body p-4 p-md-5">
                        <form>
                            <!-- Переключатели направления (One way / Round trip) -->
                            <div class="mb-4">
                                <div class="trip-switch d-inline-flex p-1 rounded-pill">
                                    <input type="radio" class="btn-check" name="tripType" id="oneWay" autocomplete="off" checked>
                                    <label class="btn rounded-pill px-4 py-2 fw-medium" for="oneWay">One way</label>

                                    <input type="radio" class="btn-check" name="tripType" id="roundTrip" autocomplete="off">
                                    <label class="btn rounded-pill px-4 py-2 fw-medium" for="roundTrip">Round trip</label>
                                </div>
                            </div>

                            <!-- Поля Откуда и Куда -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="fromCity" class="form-label text-muted small fw-semibold">From</label>
                                    <input type="text" class="form-control custom-input" id="fromCity" value="Astana" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="toCity" class="form-label text-muted small fw-semibold">To</label>
                                    <input type="text" class="form-control custom-input" id="toCity" value="Almaty" required>
                                </div>
                            </div>

                            <!-- Дата отправления, возвращения и пассажиры -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label for="departureDate" class="form-label text-muted small fw-semibold">Departure</label>
                                    <input type="date" class="form-control custom-input" id="departureDate" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="returnDate" class="form-label text-muted small fw-semibold">Return</label>
                                    <input type="date" class="form-control custom-input" id="returnDate">
                                </div>
                                <div class="col-md-4">
                                    <label for="passengers" class="form-label text-muted small fw-semibold">Passengers</label>
                                    <select class="form-select custom-input" id="passengers" required>
                                        <option value="1" selected>1 adult</option>
                                        <option value="2">2 adults</option>
                                        <option value="3">3 adults</option>
                                        <option value="4">4 adults</option>
                                        <option value="5">5 adults</option>
                                        <option value="6">6 adults</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Класс вагона (Радиокнопки) -->
                            <div class="mb-4">
                                <label class="form-label text-muted small fw-semibold d-block">Carriage class</label>
                                <div class="d-flex flex-wrap gap-4 mt-2">
                                    <div class="form-check">
                                        <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="seat" checked>
                                        <label class="form-check-label fw-medium" for="seat">Seat</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="coupe">
                                        <label class="form-check-label fw-medium" for="coupe">Coupé</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="sleeper">
                                        <label class="form-check-label fw-medium" for="sleeper">Sleeper</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Телефон и Email -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="phone" class="form-label text-muted small fw-semibold">Phone</label>
                                    <div class="input-group custom-input-group">
                                        <span class="input-group-text border-0 bg-transparent ps-3 text-success fw-bold">+7</span>
                                        <input type="tel" class="form-control border-0 bg-transparent shadow-none" id="phone" value="701 234 56 78" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label text-muted small fw-semibold">Email</label>
                                    <input type="email" class="form-control custom-input" id="email" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <!-- Чекбоксы соглашений -->
                            <div class="mb-4">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="smsCheck">
                                    <label class="form-check-label text-secondary small" for="smsCheck">
                                        Also send the ticket by SMS
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rulesCheck" required>
                                    <label class="form-check-label text-secondary small" for="rulesCheck">
                                        I agree with the carriage rules
                                    </label>
                                </div>
                            </div>

                            <!-- Кнопки управления (на мобильных Find trains выше Clear через flex order) -->
                            <div class="d-flex flex-column flex-md-row justify-content-end gap-3 mt-4">
                                <button type="reset" class="btn btn-light rounded-pill px-5 py-3 fw-semibold order-2 order-md-1 clear-btn">Clear</button>
                                <button type="submit" class="btn rounded-pill px-5 py-3 fw-semibold text-white order-1 order-md-2 submit-btn" style="background-color: #F2A93B;">Find trains</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
