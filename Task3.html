<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve a table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Montserrat', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body class="py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4 p-4 p-md-5">
                <h2 class="fw-bold mb-4 text-center">Reserve a table</h2>
                
                <form>
                    <!-- Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label">Your name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    </div>

                    <!-- Phone -->
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="phone" name="phone" required>
                    </div>

                    <!-- Guests -->
                    <div class="mb-3">
                        <label for="guests" class="form-label">Guests</label>
                        <input type="number" class="form-control" id="guests" name="guests" min="1" max="20" required>
                    </div>

                    <!-- Date -->
                    <div class="mb-3">
                        <label for="reservationDate" class="form-label">Date</label>
                        <input type="date" class="form-control" id="reservationDate" name="date" required>
                    </div>

                    <!-- Seating (Radio buttons) -->
                    <div class="mb-3">
                        <label class="form-label d-block">Seating:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="seating" id="inside" value="inside" checked>
                            <label class="form-check-label" for="inside">Inside</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="seating" id="terrace" value="terrace">
                            <label class="form-check-label" for="terrace">Terrace</label>
                        </div>
                    </div>

                    <!-- Meal Select -->
                    <div class="mb-3">
                        <label for="meal" class="form-label">Service Type</label>
                        <select class="form-select" id="meal" name="meal">
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                        </select>
                    </div>

                    <!-- Comments -->
                    <div class="mb-3">
                        <label for="comments" class="form-label">Comments</label>
                        <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
                    </div>

                    <!-- Agreement -->
                    <div class="mb-3 form-check">
                        <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                        <label class="form-check-label" for="terms">I agree to the terms</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 py-2">Reserve</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
